# APEX isometric dungeon memory map (VIC bank 0):
#   $0400-$07FF  screen A          $0801-$2FFF  BASIC stub, code, the edge columns, tables
#   $3000-$33FF  screen B          $3400-$35FF  the hero's sprites        $3800-$3FFF  characters
#   $4000-$7FFF  the code maps     $8000-$CFFF  the looks, the light, the screen copies and the
#                                                light's fixups (loaded under BASIC's ROM)
# BASIC and the KERNAL are switched out once running; the IRQ vector is at $FFFE.
MEMORY {
  ZP:       start = $0002, size = $008E, type = rw;
  LOADADDR: start = $07FF, size = $0002, file = %O;
  MAIN:     start = $0801, size = $27FF, file = %O, fill = yes;
  SCRB:     start = $3000, size = $0400, file = %O, fill = yes;
  SPRMEM:   start = $3400, size = $0400, file = %O, fill = yes;
  CHARS:    start = $3800, size = $0800, file = %O;
  HIGHMEM:  start = $4000, size = $9000, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,       type = zp;
  LOADADDR: load = LOADADDR, type = ro;
  EXEHDR:   load = MAIN,     type = ro;
  CODE:     load = MAIN,     type = ro;
  RODATA:   load = MAIN,     type = ro;
  SPRITES:  load = SPRMEM,   type = ro;
  CHARSET:  load = CHARS,    type = ro;
  HIGH:     load = HIGHMEM,  type = ro, align = $100;
}
