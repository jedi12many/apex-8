<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>APEX Dreadnought</title>
<style>
  /* One look on purpose: a C64 screen in a dark room, whatever the viewer's theme. */
  :root { --bg: #15131c; --fg: #e4e1ee; --dim: #9893ad; --key: #2c2838; --key-on: #4a4460; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100vh; touch-action: manipulation; }
  canvas { width: min(100%, 960px); aspect-ratio: 384 / 272; image-rendering: pixelated; background: #000; }
  .help { color: var(--dim); text-align: center; max-width: 960px; margin: 0; }
  .controls { display: none; width: min(100%, 480px); justify-content: space-between; align-items: center; }
  .pad { width: 144px; height: 144px; border-radius: 50%; background: var(--key); position: relative; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pad .knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--key-on); }
  .fire { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--key); color: var(--fg); font: inherit; font-weight: 600; user-select: none; -webkit-user-select: none; touch-action: none; }
  .fire.on { background: var(--key-on); }
  @media (pointer: coarse) { .controls { display: flex; } }
</style>
</head>
<body>
<canvas id="screen" width="384" height="272"></canvas>
<div class="controls"><div class="pad" id="pad" aria-label="move"><div class="knob" id="knob"></div></div><button class="fire" id="fire" aria-label="fire">FIRE</button></div>
<p class="help" id="help">Fire to start · arrow keys or W / A / S / D to fly · Space, Ctrl or K to fire (hold for autofire) · R for the title · M mutes the sound · gamepad works too</p>
<script src="../apexscii/apexscii.js"></script>
<script src="../core/shmup.js"></script>
<script src="../c64/shmup/view.js"></script>
<script src="../core/sound.js"></script>
<script src="../core/sid.js"></script>
<script src="../sound/shmup.js"></script>
<script src="../web/audio.js"></script>
<script>
// The APEX shoot-'em-up reference, playable: the same game and the same frames the C64 engine draws,
// at a fixed 50 ticks a second, inside a C64-sized border.
(async function () {
  const text = window.LEVEL_TEXT || await (await fetch('../levels/shmup/s1.txt')).text();
  const level = APEXSHMUP.parse(text);
  let game = APEXSHMUP.game(level);
  const canvas = document.getElementById('screen'), ctx = canvas.getContext('2d');
  const image = ctx.createImageData(320, 200);
  const border = APEXSCII.PALETTE[APEXSHMUPVIEW.COLORS.border];

  // The sound (web/audio.js), from the first key press, click or touch; M mutes.
  const audio = APEXAUDIO.create(APEXSONGS.shmup);
  for (const ev of ['keydown', 'pointerdown']) addEventListener(ev, () => audio.start());
  addEventListener('keydown', e => { if (e.code === 'KeyM') audio.toggleMute(); });

  // Input: keyboard, the touch pad and fire button, and the first gamepad, as joystick bits
  // (1 up, 2 down, 4 left, 8 right, 16 fire).
  const KEYS = { ArrowUp: 1, KeyW: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 4, KeyA: 4, ArrowRight: 8, KeyD: 8, Space: 16, ControlLeft: 16, ControlRight: 16, KeyK: 16 };
  let keys = 0, touch = 0, fire = 0;
  addEventListener('keydown', e => {
    if (e.code === 'KeyR') game = APEXSHMUP.game(level);
    if (KEYS[e.code]) { keys |= KEYS[e.code]; e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (KEYS[e.code]) keys &= ~KEYS[e.code]; });
  addEventListener('blur', () => { keys = 0; touch = 0; fire = 0; });
  // The pad: the direction from its centre, in eighths.
  const pad = document.getElementById('pad'), knob = document.getElementById('knob');
  const EIGHTHS = [8, 10, 2, 6, 4, 5, 1, 9]; // right, then clockwise
  const aim = e => {
    const r = pad.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
    const far = Math.hypot(dx, dy) > 12;
    touch = far ? EIGHTHS[Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) & 7] : 0;
    const k = Math.min(1, 48 / Math.max(1, Math.hypot(dx, dy)));
    knob.style.transform = far ? `translate(${dx * k}px, ${dy * k}px)` : '';
  };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); aim(e); });
  pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture(e.pointerId)) aim(e); });
  const release = () => { touch = 0; knob.style.transform = ''; };
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);
  const fireButton = document.getElementById('fire');
  const setFire = on => { fire = on ? 16 : 0; fireButton.classList.toggle('on', on); };
  fireButton.addEventListener('pointerdown', e => { e.preventDefault(); fireButton.setPointerCapture(e.pointerId); setFire(true); });
  fireButton.addEventListener('pointerup', () => setFire(false));
  fireButton.addEventListener('pointercancel', () => setFire(false));
  function gamepad() {
    const g = navigator.getGamepads && [...navigator.getGamepads()].find(Boolean);
    if (!g) return 0;
    const x = g.axes[0] || 0, y = g.axes[1] || 0, btn = i => g.buttons[i] && g.buttons[i].pressed;
    return (y < -0.4 || btn(12) ? 1 : 0) | (y > 0.4 || btn(13) ? 2 : 0) | (x < -0.4 || btn(14) ? 4 : 0) | (x > 0.4 || btn(15) ? 8 : 0) | (btn(0) || btn(1) ? 16 : 0);
  }

  function draw() {
    image.data.set(APEXSHMUPVIEW.frame(level, game).pixels);
    ctx.fillStyle = border;
    ctx.fillRect(0, 0, 384, 272);
    ctx.putImageData(image, 32, 36);
  }

  // Fixed 50 Hz ticks; the screen shows the latest.
  const TICK = 20;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc = Math.min(acc + now - last, 200);
    last = now;
    let stepped = false;
    while (acc >= TICK) {
      APEXSHMUP.tick(level, game, keys | touch | fire | gamepad());
      audio.tick(game.events, true);
      acc -= TICK;
      stepped = true;
    }
    if (stepped) draw();
    requestAnimationFrame(loop);
  }
  draw();
  requestAnimationFrame(loop);
})().catch(e => { document.getElementById('help').textContent = 'Could not start: ' + e.message; });
</script>
</body>
</html>
