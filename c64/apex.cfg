# APEX C64 memory map (VIC bank 0):
#   $0400-$07FF  screen A          $0801-$2FFF  BASIC stub, code, tables, variables
#   $3000-$33FF  sprite blocks     $3400-$37FF  screen B          $3800-$3FFF  APEXSCII raycast set
#   $4000-       object images and tables (the VIC never needs them)
#   $C000-$C7FF  quarter-square multiply tables, built at start-up
# The ROM font the status panel uses is at $1000 for the VIC, so nothing the VIC shows lives there.
MEMORY {
  ZP:       start = $0002, size = $008E, type = rw;
  LOADADDR: start = $07FF, size = $0002, file = %O;
  MAIN:     start = $0801, size = $27FF, file = %O, fill = yes;
  GAP:      start = $3000, size = $0800, file = %O, fill = yes;
  CHARS:    start = $3800, size = $0800, file = %O;
  HIGHMEM:  start = $4000, size = $6000, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,       type = zp;
  LOADADDR: load = LOADADDR, type = ro;
  EXEHDR:   load = MAIN,     type = ro;
  CODE:     load = MAIN,     type = ro;
  RODATA:   load = MAIN,     type = ro;
  TABLES:   load = MAIN,     type = ro, align = $100;
  BSS:      load = MAIN,     type = bss;
  CHARSET:  load = CHARS,    type = ro;
  HIGH:     load = HIGHMEM,  type = ro;
  DRAWTAB:  load = HIGHMEM,  type = ro, align = $100;
}
