# APEX picture viewer memory map (VIC bank 1, $4000-$7FFF):
#   $0801-       BASIC stub and code
#   $4400-$47FF  the screen (the picture's colours for bit pairs 01 and 10, copied from its data)
#   $6000-$7F3F  the bitmap, then the picture's screen and colour RAM data (to $8327) and background
# BASIC and the KERNAL are switched out once running.
MEMORY {
  ZP:       start = $0002, size = $008E, type = rw;
  LOADADDR: start = $07FF, size = $0002, file = %O;
  MAIN:     start = $0801, size = $6000 - $0801, file = %O, fill = yes;
  PICTURE:  start = $6000, size = $2711, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,       type = zp;
  LOADADDR: load = LOADADDR, type = ro;
  EXEHDR:   load = MAIN,     type = ro;
  CODE:     load = MAIN,     type = ro;
  RODATA:   load = MAIN,     type = ro;
  BSS:      load = MAIN,     type = bss;
  PICTURE:  load = PICTURE,  type = ro;
}
