# APEX story mode memory map:
#   $0400-$07FF  bitmap screen A    $2000-$3FFF  bitmap A                     (VIC bank 0)
#   $4000-$43FF  the text screen    $4800-$4BFF  the font                     (VIC bank 1)
#   $8400-$87FF  bitmap screen B    $A000-$BFFF  bitmap B                     (VIC bank 2)
#   $7FFF        0: what the VIC shows while idle in bank 1 (black)
#   $4C00-$7FFE  code, tables, the story, the song, and picture rows that don't fit elsewhere
#   $E000-       variables (under the KERNAL, switched out)
#   PIC0-PIC4, PIC6  picture rows, in RAM the VIC never reads ($0810, $1000, $8000, $8800, $C000, $4400)
#   $47FF        start-up's note that the frames are in the REU
# BASIC and the KERNAL are switched out once running; the IRQ vector is at $FFFE.
MEMORY {
  ZP:       start = $0002, size = $00FE, type = rw;
  LOADADDR: start = $07FF, size = $0002, file = %O;
  LOW:      start = $0801, size = $07FF, file = %O, fill = yes;
  LOW2:     start = $1000, size = $1000, file = %O, fill = yes;
  BMPA:     start = $2000, size = $2000, file = %O, fill = yes;
  TEXT:     start = $4000, size = $0400, file = %O, fill = yes;
  MID0:     start = $4400, size = $03FF, file = %O, fill = yes;
  NOTE:     start = $47FF, size = $0001, file = %O, fill = yes;
  FONTMEM:  start = $4800, size = $0400, file = %O, fill = yes;
  MAIN:     start = $4C00, size = $33FF, file = %O, fill = yes;
  IDLE:     start = $7FFF, size = $0001, file = %O, fill = yes;
  MID:      start = $8000, size = $0400, file = %O, fill = yes;
  SCRB:     start = $8400, size = $0400, file = %O, fill = yes;
  MID2:     start = $8800, size = $1800, file = %O, fill = yes;
  BMPB:     start = $A000, size = $2000, file = %O, fill = yes;
  HIGH:     start = $C000, size = $1000, file = %O;
  VARS:     start = $E000, size = $1FF0, type = rw;
}
SEGMENTS {
  ZEROPAGE: load = ZP,       type = zp;
  LOADADDR: load = LOADADDR, type = ro;
  EXEHDR:   load = LOW,      type = ro;
  PIC0:     load = LOW,      type = ro, optional = yes;
  PIC1:     load = LOW2,     type = ro, optional = yes;
  PIC6:     load = MID0,     type = ro, optional = yes;
  FONT:     load = FONTMEM,  type = ro;
  CODE:     load = MAIN,     type = ro;
  RODATA:   load = MAIN,     type = ro;
  PIC5:     load = MAIN,     type = ro, optional = yes;
  BSS:      load = VARS,     type = bss;
  PIC2:     load = MID,      type = ro, optional = yes;
  PIC3:     load = MID2,     type = ro, optional = yes;
  PIC4:     load = HIGH,     type = ro, optional = yes;
}
