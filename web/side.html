<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>APEX Green Hills</title>
<style>
  /* One look on purpose: a C64 screen in a dark room, whatever the viewer's theme. */
  :root { --bg: #15131c; --fg: #e4e1ee; --dim: #9893ad; --key: #2c2838; --key-on: #4a4460; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; min-height: 100vh; touch-action: manipulation; }
  canvas { width: min(100%, 960px); aspect-ratio: 384 / 272; image-rendering: pixelated; background: #000; }
  .help { color: var(--dim); text-align: center; max-width: 960px; }
  .pad { display: none; width: min(100%, 960px); justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; }
  .pad div { display: flex; gap: 12px; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 0; background: var(--key); color: var(--fg); font-size: 26px; }
  .pad button.on { background: var(--key-on); }
  .pad button:focus-visible { outline: 2px solid var(--fg); }
  @media (pointer: coarse) { .pad { display: flex; } }
</style>
</head>
<body>
<canvas id="screen" width="384" height="272"></canvas>
<div class="pad">
  <div><button data-bit="1" aria-label="left">◀</button><button data-bit="2" aria-label="right">▶</button></div>
  <div><button data-bit="4" aria-label="jump">▲</button></div>
</div>
<p class="help" id="help">Arrow keys or A / D to run · Space, Up, W or Z to jump (hold for higher) · land on beetles, collect coins, reach the flag · R to restart · M mutes the sound · gamepad works too</p>
<script src="../apexscii/apexscii.js"></script>
<script src="../core/platform.js"></script>
<script src="../c64/side/view.js"></script>
<script src="../core/sound.js"></script>
<script src="../core/sid.js"></script>
<script src="../sound/hills.js"></script>
<script src="../web/audio.js"></script>
<script>
// The APEX platformer reference, playable: the same game and the same frames the C64 engine draws, at a
// fixed 50 ticks a second, inside a C64-sized border, with its sound.
(async function () {
  const text = window.LEVEL_TEXT || await (await fetch('../levels/side/w1.txt')).text();
  const level = APEXPLAT.parse(text), map = APEXSIDE.compose(level);
  let game = APEXPLAT.game(level), cam = APEXPLAT.follow(level, game.p, 0);
  const canvas = document.getElementById('screen'), ctx = canvas.getContext('2d');
  const image = ctx.createImageData(320, 200);
  const border = APEXSCII.PALETTE[APEXSIDE.BORDER];

  // The sound (web/audio.js), from the first key press, click or touch; M mutes.
  const audio = APEXAUDIO.create(APEXSONGS.hills);
  for (const ev of ['keydown', 'pointerdown']) addEventListener(ev, () => audio.start());
  addEventListener('keydown', e => { if (e.code === 'KeyM') audio.toggleMute(); });

  // Input: keyboard, touch buttons and the first gamepad, combined into the engine's input bits.
  const KEYS = { ArrowLeft: 1, KeyA: 1, ArrowRight: 2, KeyD: 2, Space: 4, ArrowUp: 4, KeyW: 4, KeyZ: 4 };
  let keys = 0, touch = 0;
  addEventListener('keydown', e => {
    if (e.code === 'KeyR') { game = APEXPLAT.game(level); cam = APEXPLAT.follow(level, game.p, 0); }
    if (KEYS[e.code]) { keys |= KEYS[e.code]; e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (KEYS[e.code]) keys &= ~KEYS[e.code]; });
  addEventListener('blur', () => { keys = 0; touch = 0; });
  for (const b of document.querySelectorAll('.pad button')) {
    const bit = +b.dataset.bit;
    const on = e => { e.preventDefault(); touch |= bit; b.classList.add('on'); };
    const off = e => { e.preventDefault(); touch &= ~bit; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  }
  function pad() {
    const g = navigator.getGamepads && [...navigator.getGamepads()].find(Boolean);
    if (!g) return 0;
    const x = g.axes[0] || 0, btn = i => g.buttons[i] && g.buttons[i].pressed;
    return (x < -0.4 || btn(14) ? 1 : 0) | (x > 0.4 || btn(15) ? 2 : 0) | (btn(0) || btn(1) || btn(12) ? 4 : 0);
  }

  function draw() {
    const p = Object.assign({}, game.p, { hidden: !!(game.invuln & 4) });
    image.data.set(APEXSIDE.frame(level, map, p, cam, APEXSIDE.objectSprites(game, cam)).pixels);
    ctx.fillStyle = border;
    ctx.fillRect(0, 0, 384, 272);
    ctx.putImageData(image, 32, 36);
  }

  // Fixed 50 Hz ticks; the screen shows the latest.
  const TICK = 20;
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc = Math.min(acc + now - last, 200);
    last = now;
    let stepped = false;
    while (acc >= TICK) {
      APEXPLAT.play(level, game, keys | touch | pad());
      audio.tick(game.events.flatMap(e => APEXSONGS.hills.EVENTS[e] || []), true);
      cam = APEXPLAT.follow(level, game.p, cam);
      acc -= TICK;
      stepped = true;
    }
    if (stepped) draw();
    requestAnimationFrame(loop);
  }
  draw();
  requestAnimationFrame(loop);
})().catch(e => { document.getElementById('help').textContent = 'Could not start: ' + e.message; });
</script>
</body>
</html>
