# APEX shoot-'em-up memory map (VIC bank 1, $4000-$7FFF):
#   $0801-$3FFF  BASIC stub, code, tables, the screen shifts
#   $4000-$43FF  screen A          $4400-$47FF  screen B
#   $4800-$4FFF  characters A      $5000-$57FF  characters B (the same, but for the stars)
#   $5800-$5FFF  the sprites       $6000-       the level's screen rows
#   $C000-       the game's state (not loaded)
# BASIC and the KERNAL are switched out once running; the IRQ vector is at $FFFE.
MEMORY {
  ZP:       start = $0002, size = $008E, type = rw;
  LOADADDR: start = $07FF, size = $0002, file = %O;
  MAIN:     start = $0801, size = $37FF, file = %O, fill = yes;
  SCREENS:  start = $4000, size = $0800, file = %O, fill = yes;
  CHARSA:   start = $4800, size = $0800, file = %O, fill = yes;
  CHARSB:   start = $5000, size = $0800, file = %O, fill = yes;
  SPRMEM:   start = $5800, size = $0800, file = %O, fill = yes;
  HIGHMEM:  start = $6000, size = $4000, file = %O;
  STATE:    start = $C000, size = $1000, type = rw;
}
SEGMENTS {
  ZEROPAGE: load = ZP,       type = zp;
  LOADADDR: load = LOADADDR, type = ro;
  EXEHDR:   load = MAIN,     type = ro;
  CODE:     load = MAIN,     type = ro;
  RODATA:   load = MAIN,     type = ro, align = $100;
  CHARS_A:  load = CHARSA,   type = ro;
  CHARS_B:  load = CHARSB,   type = ro;
  SPRITES:  load = SPRMEM,   type = ro;
  HIGH:     load = HIGHMEM,  type = ro;
  BSS:      load = STATE,    type = bss;
}
